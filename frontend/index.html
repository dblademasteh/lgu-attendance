<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Attendance monitoring and reporting linked to LGU-HRMS." />
    <meta name="theme-color" content="#1d4ed8" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>LGU Attendance — Monitoring & Reporting</title>
    <script>
      // Apply the persisted theme pre-paint to avoid FOUC (mirrors lgu-hrms).
      try {
        var theme = localStorage.getItem('lgu-attendance-theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
